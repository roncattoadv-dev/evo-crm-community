  crm_api_token:      &crm_api_token      "89303cb6-89ce-400f-9af5-bdb0e91efb42"
  encryption_key:     &encryption_key     "mHmvRU0yrqBDjC3CtZTQ9We1XvqL49jA3Xi9iTw1ctc="
  doorkeeper_jwt_key: &doorkeeper_jwt_key "38b2b33a980b0cd78c30c858bc0180ec66d99f6e5aed5bbf463b9c9447b373f1"
  bot_runtime_secret: &bot_runtime_secret "38b2b33a980b0cd78c30c858bc0180ec66d99f6e5aed5bbf463b9c9447b373f1"

