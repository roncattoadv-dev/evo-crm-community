## ============================================================
## 🔧 ANCHORS — Blocos de variáveis reutilizáveis
## ============================================================

x-env-secrets: &env-secrets
  SECRET_KEY_BASE:     *secret_key_base
  JWT_SECRET_KEY:      *jwt_secret_key
  EVOAI_CRM_API_TOKEN: *crm_api_token

x-env-postgres: &env-postgres
  POSTGRES_HOST:     *pg_host
  POSTGRES_PORT:     *pg_port
  POSTGRES_USERNAME: *pg_user
  POSTGRES_PASSWORD: *pg_password
  POSTGRES_DATABASE: *pg_database
  POSTGRES_SSLMODE:  *pg_sslmode

x-env-redis: &env-redis
  REDIS_URL: *redis_url

x-env-cors: &env-cors
  CORS_ORIGINS: *cors_origins

x-env-urls: &env-urls
  FRONTEND_URL: *domain_frontend
  BACKEND_URL:  *domain_api

x-env-smtp: &env-smtp
  SMTP_DOMAIN:               *smtp_domain
  MAILER_SENDER_EMAIL:       *smtp_email
  SMTP_USERNAME:             *smtp_email
  SMTP_PASSWORD:             *smtp_password
  SMTP_ADDRESS:              *smtp_address
  SMTP_PORT:                 *smtp_port
  SMTP_AUTHENTICATION:       *smtp_auth
  SMTP_ENABLE_STARTTLS_AUTO: *smtp_starttls_auto

x-env-doorkeeper: &env-doorkeeper
  DOORKEEPER_JWT_SECRET_KEY:           *doorkeeper_jwt_key
  DOORKEEPER_JWT_ALGORITHM:            hs256
  DOORKEEPER_JWT_ISS:                  evo-auth-service
  OAUTH_TOKEN_EXPIRES_IN:              "86400"
  OAUTH_AUTHORIZATION_CODE_EXPIRES_IN: "600"

x-env-bot: &env-bot
  BOT_RUNTIME_URL:               http://evocrm_bot_runtime:8080
  BOT_RUNTIME_SECRET:            *bot_runtime_secret
  BOT_RUNTIME_POSTBACK_BASE_URL: http://evocrm_crm:3000

x-env-encryption: &env-encryption
  ENCRYPTION_KEY: *encryption_key

x-deploy-default: &deploy-default
  placement:
    constraints:
      - node.role == manager
  resources:
    limits:
      cpus: "1"
      memory: 1024M

x-network: &network
  networks:
    - network_public
    - easypanel
    - easypanel-evolutionapi

## ============================================================
## 🚀 SERVIÇOS
## ============================================================

services:

  ## --------------------------- GATEWAY --------------------------- ##

  evocrm_gateway:
    image: evoapicloud/evo-crm-gateway:latest
    <<: *network
    environment:
      AUTH_UPSTREAM:        evocrm_auth:3001
      CRM_UPSTREAM:         evocrm_crm:3000
      CORE_UPSTREAM:        evocrm_core:5555
      PROCESSOR_UPSTREAM:   evocrm_processor:8000
      BOT_RUNTIME_UPSTREAM: evocrm_bot_runtime:8080
    deploy:
      <<: *deploy-default
      labels:
        traefik.enable: "1"
        traefik.docker.network: network_public
        traefik.http.routers.evocrm_gateway.rule: *traefik_rule_api
        traefik.http.routers.evocrm_gateway.entrypoints: websecure
        traefik.http.routers.evocrm_gateway.priority: "1"
        traefik.http.routers.evocrm_gateway.tls.certresolver: letsencryptresolver
        traefik.http.routers.evocrm_gateway.service: evocrm_gateway
        traefik.http.services.evocrm_gateway.loadbalancer.server.port: "3030"
        traefik.http.services.evocrm_gateway.loadbalancer.passHostHeader: "true"

  ## --------------------------- AUTH --------------------------- ##

  evocrm_auth:
    image: evoapicloud/evo-auth-service-community:latest
    user: root
    command: bash -c "bundle exec rails db:migrate 2>&1 || echo 'Migration had errors, continuing...'; bundle exec rails s -p 3001 -b 0.0.0.0"
    <<: *network
    environment:
      <<: [*env-secrets, *env-postgres, *env-redis, *env-cors, *env-urls, *env-smtp, *env-doorkeeper]
      RAILS_ENV:              production
      RAILS_MAX_THREADS:      5
      MFA_ISSUER:             EvoCRM
      SIDEKIQ_CONCURRENCY:    10
      ACTIVE_STORAGE_SERVICE: local
      AUTH_SERVICE_URL:       *domain_api
    volumes:
      - evocrm_storage:/app/storage
      - /opt/evocrm-patches/auth_helper.rb:/rails/app/controllers/concerns/auth_helper.rb:ro
      - /opt/evocrm-patches/auth_storage.yml:/rails/config/storage.yml:ro
    deploy:
      <<: *deploy-default

  ## --------------------------- AUTH SIDEKIQ --------------------------- ##

  evocrm_auth_sidekiq:
    image: evoapicloud/evo-auth-service-community:latest
    user: root
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    <<: *network
    environment:
      <<: [*env-secrets, *env-postgres, *env-redis, *env-cors, *env-smtp, *env-doorkeeper]
      RAILS_ENV:              production
      MFA_ISSUER:             EvoCRM
      SIDEKIQ_CONCURRENCY:    10
      ACTIVE_STORAGE_SERVICE: local
      AUTH_SERVICE_URL:       *domain_api
    volumes:
      - evocrm_storage:/app/storage
      - /opt/evocrm-patches/auth_helper.rb:/rails/app/controllers/concerns/auth_helper.rb:ro
      - /opt/evocrm-patches/auth_storage.yml:/rails/config/storage.yml:ro
    healthcheck:
      disable: true
    deploy:
      <<: *deploy-default

  ## --------------------------- CRM --------------------------- ##

  evocrm_crm:
    image: evoapicloud/evo-ai-crm-community:latest
    command: sh -c "until wget -qO- http://evocrm_auth:3001/health >/dev/null 2>&1; do echo 'Waiting for auth...'; sleep 5; done; bundle exec rails db:migrate 2>&1 || echo 'Migration had errors, continuing...'; bundle exec rails runner /app/boot_checks/ensure_messages_status_integer.rb 2>&1 || echo 'Boot check failed, continuing...'; bundle exec rails s -p 3000 -b 0.0.0.0"
    <<: *network
    environment:
      <<: [*env-secrets, *env-postgres, *env-redis, *env-cors, *env-urls, *env-bot]
      RAILS_ENV:                production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT:      "true"
      EVO_AUTH_SERVICE_URL:     http://evocrm_auth:3001
      EVO_AI_CORE_SERVICE_URL:  http://evocrm_core:5555
      EVO_AI_PROCESSOR_URL:     http://evocrm_processor:8000
      DISABLE_TELEMETRY:        "true"
      LOG_LEVEL:                info
      ENABLE_ACCOUNT_SIGNUP:    "true"
      ENABLE_PUSH_RELAY_SERVER: "true"
      ENABLE_INBOX_EVENTS:      "true"
    volumes:
      - evocrm_storage:/app/storage
      - /opt/evocrm-patches/cable.yml:/app/config/cable.yml:ro
      - /opt/evocrm-patches/evolution_helpers.rb:/app/app/services/whatsapp/evolution_handlers/helpers.rb:ro
      - /opt/evocrm-patches/action_cable_listener.rb:/app/app/listeners/action_cable_listener.rb:ro
      - /opt/evocrm-patches/evolution_service.rb:/app/app/services/whatsapp/providers/evolution_service.rb:ro
      - /opt/evocrm-patches/evolution_content_handlers.rb:/app/app/services/whatsapp/evolution_handlers/content_handlers.rb:ro
      - /opt/evocrm-patches/n8n_request_service.rb:/app/app/services/agent_bots/n8n_request_service.rb:ro
      - /opt/evocrm-patches/agent_bot_listener.rb:/app/app/listeners/agent_bot_listener.rb:ro
      - /opt/evocrm-patches/delegation_service.rb:/app/app/services/bot_runtime/delegation_service.rb:ro
      - /opt/evocrm-patches/20260626000001_fix_messages_status_integer.rb:/app/db/migrate/20260626000001_fix_messages_status_integer.rb:ro
      - /opt/evocrm-patches/contact_inbox_builder.rb:/app/app/builders/contact_inbox_builder.rb:ro
      - /opt/evocrm-patches/contact_inbox_with_contact_builder.rb:/app/app/builders/contact_inbox_with_contact_builder.rb:ro
      - /opt/evocrm-patches/messages_upsert.rb:/app/app/services/whatsapp/evolution_handlers/messages_upsert.rb:ro
      - /opt/evocrm-patches/incoming_message_evolution_service.rb:/app/app/services/whatsapp/incoming_message_evolution_service.rb:ro
      - /opt/evocrm-patches/pipeline_items_controller.rb:/app/app/controllers/api/v1/pipeline_items_controller.rb:ro
      - /opt/evocrm-patches/ensure_messages_status_integer.rb:/app/boot_checks/ensure_messages_status_integer.rb:ro
    deploy:
      <<: *deploy-default

  ## --------------------------- CRM SIDEKIQ --------------------------- ##

  evocrm_crm_sidekiq:
    image: evoapicloud/evo-ai-crm-community:latest
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    <<: *network
    environment:
      <<: [*env-secrets, *env-postgres, *env-redis, *env-cors, *env-urls, *env-bot]
      RAILS_ENV:               production
      EVO_AUTH_SERVICE_URL:    http://evocrm_auth:3001
      EVO_AI_CORE_SERVICE_URL: http://evocrm_core:5555
      EVO_AI_PROCESSOR_URL:    http://evocrm_processor:8000
    volumes:
      - evocrm_storage:/app/storage
      - /opt/evocrm-patches/evolution_helpers.rb:/app/app/services/whatsapp/evolution_handlers/helpers.rb:ro
      - /opt/evocrm-patches/action_cable_listener.rb:/app/app/listeners/action_cable_listener.rb:ro
      - /opt/evocrm-patches/evolution_service.rb:/app/app/services/whatsapp/providers/evolution_service.rb:ro
      - /opt/evocrm-patches/evolution_content_handlers.rb:/app/app/services/whatsapp/evolution_handlers/content_handlers.rb:ro
      - /opt/evocrm-patches/n8n_request_service.rb:/app/app/services/agent_bots/n8n_request_service.rb:ro
      - /opt/evocrm-patches/agent_bot_listener.rb:/app/app/listeners/agent_bot_listener.rb:ro
      - /opt/evocrm-patches/delegation_service.rb:/app/app/services/bot_runtime/delegation_service.rb:ro
      - /opt/evocrm-patches/contact_inbox_builder.rb:/app/app/builders/contact_inbox_builder.rb:ro
      - /opt/evocrm-patches/contact_inbox_with_contact_builder.rb:/app/app/builders/contact_inbox_with_contact_builder.rb:ro
      - /opt/evocrm-patches/messages_upsert.rb:/app/app/services/whatsapp/evolution_handlers/messages_upsert.rb:ro
      - /opt/evocrm-patches/incoming_message_evolution_service.rb:/app/app/services/whatsapp/incoming_message_evolution_service.rb:ro
    deploy:
      <<: *deploy-default

  ## --------------------------- CORE --------------------------- ##

  evocrm_core:
    image: evoapicloud/evo-ai-core-service-community:latest
    <<: *network
    environment:
      <<: [*env-secrets, *env-encryption]
      DB_HOST:               *pg_host
      DB_PORT:               *pg_port
      DB_USER:               *pg_user
      DB_PASSWORD:           *pg_password
      DB_NAME:               *pg_database
      DB_SSLMODE:            *pg_sslmode
      DB_MAX_IDLE_CONNS:     10
      DB_MAX_OPEN_CONNS:     100
      DB_CONN_MAX_LIFETIME:  1h
      DB_CONN_MAX_IDLE_TIME: 30m
      PORT:                  5555
      JWT_ALGORITHM:         HS256
      EVOLUTION_BASE_URL:    http://evocrm_crm:3000
      EVO_AUTH_BASE_URL:     http://evocrm_auth:3001
      AI_PROCESSOR_URL:      http://evocrm_processor:8000
      AI_PROCESSOR_VERSION:  v1
    deploy:
      <<: *deploy-default

  ## --------------------------- PROCESSOR --------------------------- ##

  evocrm_processor:
    image: evoapicloud/evo-ai-processor-community:latest
    command: sh -c "alembic upgrade head 2>&1 || echo 'Alembic migration had errors, continuing...'; python -m scripts.run_seeders; uvicorn src.main:app --host $$HOST --port $$PORT"
    volumes:
      - evocrm_processor_logs:/app/logs
      - /opt/evocrm-patches/src/services/adk/agents/external_agent.py:/app/src/services/adk/agents/external_agent.py:ro
      - /opt/evocrm-patches/src/services/adk/runners/standard_runner.py:/app/src/services/adk/runners/standard_runner.py:ro
      - /opt/evocrm-patches/src/services/providers/n8n_service.py:/app/src/services/providers/n8n_service.py:ro
      - /opt/evocrm-patches/src/api/a2a_routes.py:/app/src/api/a2a_routes.py:ro
      - /opt/evocrm-patches/src/api/session_routes.py:/app/src/api/session_routes.py:ro
      - /opt/evocrm-patches/src/middleware/evo_auth.py:/app/src/middleware/evo_auth.py:ro
    <<: *network
    environment:
      <<: [*env-secrets, *env-encryption]
      POSTGRES_CONNECTION_STRING: "postgresql://postgres:4a4d4ddd16a1526bc69c@evolutionapi-evolution-api-db:5432/evolutionapi"
      EVOAI_CRM_API_TOKEN: *crm_api_token
      REDIS_HOST:          evocrm_redis
      REDIS_PORT:          6379
      REDIS_PASSWORD:      ""
      REDIS_SSL:           "false"
      REDIS_DB:            0
      REDIS_KEY_PREFIX:    a2a_
      REDIS_TTL:           3600
      HOST:                0.0.0.0
      PORT:                8000
      DEBUG:               "false"
      EVO_AI_CRM_URL:      http://evocrm_crm:3000
      CORE_SERVICE_URL:    http://evocrm_core:5555/api/v1
      EVO_AUTH_BASE_URL:    http://evocrm_auth:3001
      EVO_CORE_BASE_URL:    http://evocrm_core:5555
      APP_URL:             *domain_frontend
      API_URL:             *domain_api
      API_TITLE:           Agent Processor Community
      API_DESCRIPTION:     Agent Processor Community for Evo AI
      API_VERSION:         1.0.0
      ORGANIZATION_NAME:   Evo CRM
      TOOLS_CACHE_ENABLED: "true"
      TOOLS_CACHE_TTL:     3600
    deploy:
      <<: *deploy-default

  ## --------------------------- BOT RUNTIME --------------------------- ##

  evocrm_bot_runtime:
    image: evoapicloud/evo-bot-runtime:latest
    <<: *network
    environment:
      LISTEN_ADDR:             0.0.0.0:8080
      REDIS_URL:               *redis_url
      AI_PROCESSOR_URL:        http://evocrm_processor:8000
      BOT_RUNTIME_SECRET:      *bot_runtime_secret
      AI_CALL_TIMEOUT_SECONDS: 30
    deploy:
      <<: *deploy-default

  ## --------------------------- FRONTEND --------------------------- ##

  evocrm_frontend:
    image: evoapicloud/evo-ai-frontend-community:latest
    <<: *network
    environment:
    - VITE_APP_ENV=production
    - VITE_API_URL=https://api-evocrm.roncattoadvocacia.com.br
    - VITE_AUTH_API_URL=https://api-evocrm.roncattoadvocacia.com.br
    - VITE_EVOAI_API_URL=https://api-evocrm.roncattoadvocacia.com.br
    - VITE_AGENT_PROCESSOR_URL=https://api-evocrm.roncattoadvocacia.com.br
    - VITE_WS_URL=wss://api-evocrm.roncattoadvocacia.com.br
    volumes:
      - /opt/evocrm-patches/nginx_frontend_default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      <<: *deploy-default
      labels:
        traefik.enable: "1"
        traefik.docker.network: network_public
        traefik.http.routers.evocrm_frontend.rule: *traefik_rule_frontend
        traefik.http.routers.evocrm_frontend.entrypoints: websecure
        traefik.http.routers.evocrm_frontend.priority: "1"
        traefik.http.routers.evocrm_frontend.tls.certresolver: letsencryptresolver
        traefik.http.routers.evocrm_frontend.service: evocrm_frontend
        traefik.http.services.evocrm_frontend.loadbalancer.server.port: "80"
        traefik.http.services.evocrm_frontend.loadbalancer.passHostHeader: "true"

  ## --------------------------- REDIS --------------------------- ##

  evocrm_redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    volumes:
      - evocrm_redis:/data
    <<: *network
    ## Descomente para expor externamente:
    # ports:
    #   - 6379:6379
    deploy:
      <<: *deploy-default

## ============================================================
## 📦 VOLUMES & NETWORKS
## ============================================================

volumes:
  evocrm_processor_logs:
    external: true
    name: evocrm_processor_logs
  evocrm_redis:
    external: true
    name: evocrm_redis
  evocrm_storage:

networks:
  network_public:
    external: true
    name: network_public
  easypanel:
    external: true
    name: easypanel
  easypanel-evolutionapi:
    external: true
    name: easypanel-evolutionapi