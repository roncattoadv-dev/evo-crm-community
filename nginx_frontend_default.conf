server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    # NOTE: Do not set X-Frame-Options globally because /widget must be embeddable in third-party sites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: 'wasm-unsafe-eval' is required by FFmpeg WASM (self-hosted under /ffmpeg/).
    # 'worker-src blob:' allows the FFmpeg core worker; 'connect-src' is permissive for
    # backend/CDN-less deploys — tighten per environment if needed.
    # script-src allows the Facebook SDK (WhatsApp Cloud / Facebook / Instagram Embedded
    # Signup) — needed for the Meta channel connection flow. 'blob:' is required by
    # FFmpeg WASM which loads its worker as a Blob URL; connect-src 'blob:' is required
    # so the audio recorder can fetch the recorded blob before transcoding to OGG/Opus.
    # googletagmanager.com deliberately NOT allowed here (removed 2026-09-02): the
    # frontend bundle calls gtag.js unconditionally at boot with a measurement ID
    # (G-DKSKFWQWVK) hardcoded by evolution-foundation into the build — vendor telemetry
    # from every self-hosted instance, not a customer-configurable feature (no admin
    # setting gates it). CSP block is enough; the app's own dataLayer.push calls stay
    # local no-ops, and the blocked <script src> also stops the "Cannot read properties
    # of undefined (reading 'startTime')" error thrown inside gtag's bundled web-vitals
    # reporter. If evolution-foundation ever exposes this as an opt-in setting, revisit.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com https://*.easypanel.host; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html: inject audio-defaults script via sub_filter.
    # gzip must be off here so sub_filter can process the response.
    # The script sets localStorage defaults only for users who have never
    # configured audio settings, enabling sound-on-foreground-tab by default.
    location = /index.html {
        gzip off;
        # Redeclare the server-level security headers: nginx drops ALL inherited
        # add_header directives from the parent context the moment a location block
        # sets even one of its own (this block already set Cache-Control below) — found
        # 2026-09-02 while verifying the googletagmanager.com CSP removal: curl showed
        # NO security headers at all on `/`, not even the old CSP. try_files' internal
        # redirect to /index.html re-enters location matching and lands here for every
        # SPA route and the root path, so this was the actual document response missing
        # CSP/nosniff/XSS-protection this whole time, not just an edge case.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com https://*.easypanel.host; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        sub_filter '</head>' '<script>(function(){var k="audio_notification_settings",d={enable_audio_alerts:true,notification_tone:"ding",always_play_audio_alert:true,alert_if_unread_assigned_conversation_exist:false};try{var e=JSON.parse(localStorage.getItem(k)||"{}");if(!e.enable_audio_alerts||!e.always_play_audio_alert)localStorage.setItem(k,JSON.stringify(Object.assign(d,e,{enable_audio_alerts:true,always_play_audio_alert:true})))}catch(x){localStorage.setItem(k,JSON.stringify(d))}})();</script></head>';
        sub_filter_once on;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Patch: clicking the file icon/name opens the document in a new tab. The explicit
    # download button (arrow icon) is separate and INTENTIONALLY keeps downloading —
    # confirmed with the user 2026-07-07, do not touch its download behavior.
    # Turns out clicking the icon/filename area did NOTHING at all (no onClick existed) —
    # that was the actual gap, not the download button's behavior. Adds onClick+cursor to
    # the row div, and stopPropagation on the download button so clicking it doesn't ALSO
    # trigger the new open-in-tab handler on the parent row.
    # Regex matches any ChatPage hash so the fix survives image updates, but both
    # sub_filter strings are EXACT minified-JS snippets — vendor rebuilds can rename the
    # local variables and silently break the match. If this stops working, re-grep the
    # served bundle for `messages.messageFile.fileFallbackTitle` to find the current
    # component and re-derive the row/button structure.
    location ~* /assets/ChatPage-.+\.js$ {
        gzip off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'className:"flex items-center gap-3 py-2 transition-colors w-full",style:{minWidth:"200px",maxWidth:"min(280px, calc(100vw - 120px))"}' 'className:"flex items-center gap-3 py-2 transition-colors w-full cursor-pointer",onClick:()=>window.open(o.data_url,"_blank","noopener,noreferrer"),style:{minWidth:"200px",maxWidth:"min(280px, calc(100vw - 120px))"}';
        sub_filter 'onClick:()=>s(o),className:"h-8 w-8 rounded-full' 'onClick:ev=>{ev.stopPropagation(),s(o)},className:"h-8 w-8 rounded-full';
        sub_filter_once on;
        # NOT "public, immutable" on purpose: this file is under active sub_filter
        # patching. `immutable` + expires 1y means browsers skip the network entirely on
        # reload (even Ctrl+Shift+R doesn't always bypass it) — confirmed 2026-07-07 this
        # caused a user to see a stale, unpatched bundle for the ENTIRE debugging session
        # while every server-side check showed the fix was live. Cost: this hashed asset
        # re-validates every load instead of being cached for a year — acceptable given
        # it's actively patched.
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSAT save-button patch REMOVED 2026-09-02: upstream refactored the inbox settings
    # tabs (incl. CSAT) onto a unified footer save button registered via `registerSave`
    # (evo-ai-frontend-community commit 36b05b15, "registra a aba do agente de IA no
    # rodapé unificado de salvar") — the footer save button is no longer conditionally
    # rendered inside the CSAT panel itself, so the original hidden-when-toggle-off bug
    # is structurally gone. Confirmed the old target string no longer exists anywhere in
    # the bundle. If a similar "can't save with toggle off" bug resurfaces on some other
    # settings tab, look at the unified footer/registerSave wiring, not this file.
    #
    # Patch: attachment open-in-new-tab fallback (shared cs/P0e helper) was forcing a
    # download instead of opening inline whenever window.open() got popup-blocked. The
    # fallback anchor set BOTH target="_blank" AND download=filename — per the HTML spec
    # the `download` attribute wins over target, forcing a save-as dialog every time the
    # primary window.open() path was blocked. Server already sends
    # Content-Disposition: inline, so dropping the `download` assignment lets the
    # target="_blank" anchor open the file inline as intended. Added 2026-07-07, minified
    # variable renamed s->r by the 2026-09-02 frontend rebuild — re-derive by grepping
    # the served bundle for `.download=t),` if this breaks again.
    #
    # Patch: disable the "unanswered conversations" counter added 2026-09-02's frontend
    # update. Its backend endpoint (GET /conversations/unanswered_count) only exists on
    # evo-ai-crm-community's `develop` branch, not yet in the `main`/`:latest` release we
    # run — so every poll 404s. The call site already caught the error (console.warn only,
    # no crash), but neuters getUnansweredCount() to resolve locally instead of hitting the
    # network, which drops the console noise and the repeated failed requests. Remove this
    # once the backend ships the matching release (grep the CRM changelog for
    # "unanswered_count" or "EVO-" ticket adding it) — the counter will then work on its own.
    #
    # Patch: MainLayout's ErrorBoundary (class `Lve` in this build) was keyed by the full
    # route pathname (`d` = useLocation().pathname) instead of just its top-level segment.
    # Any :id-bearing route (e.g. switching /conversations/<id1> -> /conversations/<id2>)
    # changes that key, so React tears down and remounts the ENTIRE page subtree on every
    # navigation within the same section — confirmed via live fiber-tree instrumentation
    # 2026-09-02: 89% of the fiber tree (4827/5408 nodes) recreated on a conversation
    # switch, causing the conversation list, all 6 chat context providers, and the
    # message pane to refetch from scratch (GET /conversations?page=1... plus duplicate
    # update_last_seen/messages calls) instead of just re-rendering with new props.
    # Upstream bug in evo-ai-frontend-community's MainLayout.tsx (the ErrorBoundary is
    # intentionally keyed by pathname so a crashed page's fallback clears on navigation —
    # the granularity is just wrong, it should reset per top-level section, not per :id).
    # Fix: key by the first path segment only. Re-derive if `Lve`/`d` are renamed by a
    # future rebuild — grep for `children:a.jsx(Lve,{children:e},d)` (or search for
    # `.pathname,[u,m]=p.useState(!1)` to relocate the MainLayout component `Qt`).
    location ~* /assets/index-.+\.js$ {
        gzip off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 't&&(r.download=t),r.target="_blank"' 'r.target="_blank"';
        sub_filter 'async getUnansweredCount(){const e=await de.get("/conversations/unanswered_count");return me(e)}' 'async getUnansweredCount(){return{unanswered_count:0}}';
        sub_filter 'children:a.jsx(Lve,{children:e},d)' 'children:a.jsx(Lve,{children:e},d.split("/")[1])';
        sub_filter_once on;
        # Remove immutable so the browser re-validates after patch deploys
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Patch: "Atribuir Etiquetas" (AssignmentModal) content leaking outside the dialog.
    # DialogContent had no max-height, and the selected-labels badge area had no height
    # cap either — with many labels (options or selected), the modal grew past the
    # viewport instead of scrolling internally.
    # Regex matches any AssignmentModal-*.js hash so the fix survives image updates.
    location ~* /assets/AssignmentModal-.+\.js$ {
        gzip off;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'className:"max-w-md"' 'className:"max-w-md max-h-[85vh] flex flex-col overflow-hidden"';
        sub_filter 'className:"space-y-4"' 'className:"space-y-4 overflow-y-auto flex-1 min-h-0"';
        sub_filter 'className:"flex flex-wrap gap-2 p-3 bg-muted/50 rounded-lg"' 'className:"flex flex-wrap gap-2 p-3 bg-muted/50 rounded-lg max-h-32 overflow-y-auto"';
        sub_filter_once on;
        # Remove immutable so the browser re-validates after patch deploys
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
