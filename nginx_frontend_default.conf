server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    # NOTE: Do not set X-Frame-Options globally because /widget must be embeddable in third-party sites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: 'wasm-unsafe-eval' is required by FFmpeg WASM (self-hosted under /ffmpeg/).
    # 'worker-src blob:' allows the FFmpeg core worker; 'connect-src' is permissive for
    # backend/CDN-less deploys — tighten per environment if needed.
    # script-src allows the Facebook SDK (WhatsApp Cloud / Facebook / Instagram Embedded
    # Signup) and Google Tag Manager (GA4) — both load external scripts that would
    # otherwise be blocked. 'blob:' is required by FFmpeg WASM which loads its worker
    # as a Blob URL; connect-src 'blob:' is required so the audio recorder can fetch
    # the recorded blob before transcoding to OGG/Opus.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com https://*.easypanel.host; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html: inject audio-defaults script via sub_filter.
    # gzip must be off here so sub_filter can process the response.
    # The script sets localStorage defaults only for users who have never
    # configured audio settings, enabling sound-on-foreground-tab by default.
    location = /index.html {
        gzip off;
        sub_filter '</head>' '<script>(function(){var k="audio_notification_settings",d={enable_audio_alerts:true,notification_tone:"ding",always_play_audio_alert:true,alert_if_unread_assigned_conversation_exist:false};try{var e=JSON.parse(localStorage.getItem(k)||"{}");if(!e.enable_audio_alerts||!e.always_play_audio_alert)localStorage.setItem(k,JSON.stringify(Object.assign(d,e,{enable_audio_alerts:true,always_play_audio_alert:true})))}catch(x){localStorage.setItem(k,JSON.stringify(d))}})();</script></head>';
        sub_filter_once on;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
